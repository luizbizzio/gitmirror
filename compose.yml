services:
  gitmirror:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.yml:/config/config.yml:ro
      - gitmirror-data:/data
      # Mount SSH files prepared for the container account.
      # Include verified known_hosts. Never use StrictHostKeyChecking=no.
      - ./docker/ssh:/home/gitmirror/.ssh:ro
    command: ["--config", "/config/config.yml", "run"]

  gitmirror-web:
    build: .
    profiles: ["web"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./config.yml:/config/config.yml:ro
      - type: bind
        source: ./docker/web-password
        target: /config/web-password
        read_only: true
        bind:
          create_host_path: false
      - gitmirror-data:/data
      - gitmirror-restores:/restores
      - ./docker/ssh:/home/gitmirror/.ssh:ro
    command:
      - --config
      - /config/config.yml
      - web
      - --host
      - 0.0.0.0
      - --allow-lan
      - --allow-insecure-http
      - --password-file
      - /config/web-password
      - --restore-dir
      - /restores

volumes:
  gitmirror-data:
  gitmirror-restores:
