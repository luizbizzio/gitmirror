[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitmirror-resilient"
version = "0.1.0a1"
description = "Resilient Git mirroring across GitHub, GitLab, Codeberg and Gitea"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["PyYAML>=6,<7", "filelock>=3.12,<4"]
keywords = ["git", "backup", "mirror", "github", "gitlab", "codeberg", "gitea"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
gitmirror = "gitmirror:main"

[tool.setuptools]
py-modules = ["gitmirror"]

[tool.setuptools.data-files]
"share/gitmirror/web" = ["web/index.html", "web/style.css", "web/app.js"]
"share/gitmirror/web/fonts" = ["web/fonts/LICENSE.md", "web/fonts/source-sans-pro-regular.woff2", "web/fonts/source-sans-pro-semibold.woff2", "web/fonts/source-sans-pro-bold.woff2", "web/fonts/source-sans-pro-italic.woff2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
