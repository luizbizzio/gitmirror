# GitMirror configuration, version 2
# Copy this file to config.yml and edit the owners.
# Keep tokens in environment variables or separate files, never in Git.
version: 2

source:
  provider: github
  owner: your-github-user
  token_env: GITHUB_TOKEN

destinations:
  - provider: gitlab
    owner: your-gitlab-user
    token_env: GITLAB_TOKEN
  - provider: codeberg
    owner: your-codeberg-user
    token_env: CODEBERG_TOKEN
  # Optional. Create the directory on the intended drive, then run init-backup.
  # - provider: local
  #   path: /mnt/backups/gitmirror
  # Windows example: path: 'D:\Backups\GitMirror'

storage:
  path: ~/gitmirror-data

retry:
  delays_seconds: [3, 8, 20]

schedule:
  interval_hours: 12
